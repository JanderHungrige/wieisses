name: voice-image

# Build the Thorsten-Voice image (voice/) and push it to GHCR — only when voice/ changes, because
# the image carries a 114 MB model that never changes with the app. The build downloads the model
# pinned by revision and sha256 and synthesises "Hallo" as a smoke test; a voice that cannot
# speak never reaches the registry. The host cron rolls it like the app (deploy/auto-deploy.sh).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'voice/**'
      - '.github/workflows/voice.yml'
  pull_request:
    branches: [main]
    paths:
      - 'voice/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: voice-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: janderhungrige
  IMAGE: wieisses-voice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build voice image (downloads the pinned model, speaks a smoke test)
        env:
          DOCKER_BUILDKIT: "1"
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --label "org.opencontainers.image.source=https://github.com/JanderHungrige/wieisses" \
            -t "$IMG:main" -t "$IMG:$SHA" voice/

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          push () {
            ref="$1"; n=1
            until docker push "$ref"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::docker push $ref failed after $n attempts"
                return 1
              fi
              echo "push failed (attempt $n) — retrying in $((n * 15))s"
              sleep $((n * 15))
              n=$((n + 1))
            done
          }
          push "$IMG:main"
          push "$IMG:$SHA"
