# The production stack, deployed from the prebuilt GHCR image and kept current by
# deploy/auto-deploy.sh (root cron via deploy/roll-all.sh):
#
#   docker compose --env-file deploy/.env.prod -f deploy/compose.app.yml up -d   # 172.17.0.1:8082
#
# COMPOSE_PROJECT_NAME (set in the env-file) names the stack and scopes the volume. The port is
# published on the Docker bridge gateway 172.17.0.1 only: Nginx Proxy Manager runs as a container
# and reaches the app there (wieisses.w3rth.de -> http://172.17.0.1:8082). A bare "8082:8080"
# would bind 0.0.0.0 and answer the whole internet in plaintext beside the proxy.
services:
  app:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-janderhungrige}/${IMAGE:-wieisses}:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    ports:
      - "172.17.0.1:${APP_PORT}:8080"
    environment:
      APP_ENV: ${APP_ENV:-prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in the env file}
      NODE_OPTIONS: "--max-old-space-size=128"
      # The Thorsten voice below, on this stack's own network only.
      VOICE_URL: http://voice:5000
    # The database and uploads. Never `down -v`: that deletes every answer.
    volumes:
      - wieisses-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    pids_limit: 64
    # A weight, not a quota: under contention the other projects on this host come first.
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Same probe as the Dockerfile HEALTHCHECK; auto-deploy.sh waits for "healthy".
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Thorsten-Voice (Kokoro). No published port: only the app above reaches it, as voice:5000.
  # It holds the model (~400 MB) only while voicing and releases it after two idle minutes.
  voice:
    image: ${REGISTRY:-ghcr.io}/${OWNER:-janderhungrige}/${VOICE_IMAGE:-wieisses-voice}:${IMAGE_TAG}
    restart: unless-stopped
    init: true
    read_only: true
    # exec: phonemizer copies espeak-ng's shared library to /tmp and loads it from there.
    tmpfs:
      - /tmp:size=16m,mode=1777,exec
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Measured peak 555 MiB (71 texts up to 400 characters); ≈ 30 MB once the model is released.
    mem_limit: 768m
    pids_limit: 64
    # One of the host's two cores at most, and a low weight: the other projects come first.
    cpus: 1.0
    cpu_shares: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  wieisses-data:
